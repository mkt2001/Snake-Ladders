name: Build APK and Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        id: find
        run: |
          mkdir -p _src
          unzip -q -o "$(ls *.zip | head -1)" -d _src
          P=$(dirname "$(dirname "$(find _src -name ProjectVersion.txt | head -1)")")
          echo "Project path: $P"
          echo "path=$P" >> "$GITHUB_OUTPUT"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ steps.find.outputs.path }}/Library
          key: Library-Android-${{ github.run_number }}
          restore-keys: Library-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ steps.find.outputs.path }}
          targetPlatform: Android
          unityVersion: 2022.3.20f1
          buildMethod: BuildScript.BuildAndroid
          allowDirtyBuild: true

      - name: Locate APK
        id: apk
        run: |
          F=$(find . -name "SnakeLadder3D.apk" | head -1)
          echo "APK: $F"
          test -n "$F"
          cp "$F" SnakeLadder3D.apk
          echo "file=SnakeLadder3D.apk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeLadder3D-APK
          path: SnakeLadder3D.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Snake & Ladder 3D v${{ github.run_number }}
          body: "Snake & Ladder 3D - Ultimate Edition. APK neeche Assets me hai."
          files: SnakeLadder3D.apk
